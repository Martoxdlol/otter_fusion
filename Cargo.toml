[package]
name = "otter_fusion"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
cranelift-codegen = "0.110"
cranelift-frontend = "0.110"
cranelift-module = "0.110"
cranelift-jit = "0.110"                         # JIT
cranelift-object = "0.110"                      # AOT
cranelift-native = "0.110"
target-lexicon = "0.12"

[dev-dependencies]
insta = { version = "1.47.2", features = ["glob"] }
